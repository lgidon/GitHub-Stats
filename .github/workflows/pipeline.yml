name: DevOps Analytics Data Pipeline

on:
  schedule:
    # Runs daily at midnight UTC
    - cron: '0 0 * * *'
  workflow_dispatch: # Allows manual trigger from GitHub UI

permissions:
  contents: write

jobs:
  # ---------------------------------------------------------------------------
  # JOB 1: Complete ELT Pipeline Processing
  # ---------------------------------------------------------------------------
  build-elt:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install uv and Set up Python
        uses: astral-sh/setup-uv@v5
        with:
          python-version: '3.11'
          enable-cache: true

      - name: Install dependencies
        run: |
          uv venv --allow-existing
          if [ -f requirements-elt.txt ]; then uv pip install --system -r requirements-elt.txt; fi

          echo "$GITHUB_WORKSPACE/.venv/bin" >> $GITHUB_PATH

      - name: Step 1 - Extract Raw Data
        env:
          TOKEN: ${{ secrets.TOKEN }}
        run: python src/extract.py

      - name: Step 2 - Transform with dbt
        run: |
          cd transform
          dbt run --profiles-dir ./.dbt
          dbt test --profiles-dir ./.dbt

      - name: Step 3 - Export Marts to Parquet
        run: python src/export.py

      - name: Step 4 - Upload Parquet Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: github-dora-metrics-parquet
          path: data/exports/*.parquet
          retention-days: 14
  # ---------------------------------------------------------------------------
  # JOB 2: Publish Parquet Exports back to repository for Streamlit
  # ---------------------------------------------------------------------------
  publish-marts:
    needs: build-elt
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Download Parquet Artifacts
        uses: actions/download-artifact@v4
        with:
          name: github-dora-metrics-parquet
          path: data/exports/

      - name: Commit Updated Parquet Exports
        run: |
          git config --global user.name 'github-actions[bot]'
          git config --global user.email 'github-actions[bot]@users.noreply.github.com'
          git add data/exports/*.parquet
          git diff --quiet && git diff --staged --quiet || (git commit -m "auto: update analytical parquet exports" && git push)
