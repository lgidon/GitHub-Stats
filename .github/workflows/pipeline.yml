name: DevOps Analytics Data Pipeline

on:
  schedule:
    # Runs daily at midnight UTC
    - cron: '0 0 * * *'
  workflow_dispatch: # Allows manual trigger from GitHub UI

permissions:
  contents: write

jobs:
  # ---------------------------------------------------------------------------
  # JOB 1: Complete ELT Pipeline Processing
  # ---------------------------------------------------------------------------
  build-elt:
    outputs:
      should_run_job2: ${{ steps.handle_failure.outputs.should_run_job2 || 'true' }}
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install uv and Set up Python
        uses: astral-sh/setup-uv@v5
        with:
          python-version: '3.11'
          enable-cache: true

      - name: Install dependencies
        run: |
          uv venv --allow-existing
          if [ -f requirements-elt.txt ]; then uv pip install -r requirements-elt.txt; fi

          echo "$GITHUB_WORKSPACE/.venv/bin" >> $GITHUB_PATH

      - name: Step 1 - Extract Raw Data
        env:
          TOKEN: ${{ secrets.TOKEN }}
        run: python src/extract.py

      - name: Step 2 - Transform with dbt
        run: |
          cd transform
          dbt run --profiles-dir ./.dbt
          dbt test --profiles-dir ./.dbt

      - name: Step 3 - Export Marts to Parquet
        run: python src/export.py

      - name: Step 4 - Upload Parquet Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: github-dora-metrics-parquet
          path: data/exports/*.parquet
          retention-days: 14

      # Catch failures right at the end of Job 1
      - name: Handle Failures
        id: handle_failure
        if: failure()
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "::warning::Job 1 failed during a manual run. Suppressing failure email and stopping workflow."
            echo "should_run_job2=false" >> "$GITHUB_OUTPUT"
            exit 0
          else
            # On automated runs, exit with code 1 so it fails normally and sends the email
            exit 1
          fi

  # ---------------------------------------------------------------------------
  # JOB 2: Publish Parquet Exports back to repository for Streamlit
  # ---------------------------------------------------------------------------
  publish-marts:
    needs: build-elt
    if: ${{ needs.build-elt.result == 'success' && needs.build-elt.outputs.should_run_job2 != 'false' }}
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Download Parquet Artifacts
        uses: actions/download-artifact@v4
        with:
          name: github-dora-metrics-parquet
          path: data/exports/

      - name: Commit Updated Parquet Exports
        run: |
          git config --global user.name 'github-actions[bot]'
          git config --global user.email 'github-actions[bot]@users.noreply.github.com'
          git add data/exports/*.parquet
          git diff --quiet && git diff --staged --quiet || (git commit -m "auto: update analytical parquet exports" && git push)
