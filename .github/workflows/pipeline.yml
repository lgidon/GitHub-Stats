name: DevOps Analytics Data Pipeline

on:
  schedule:
    # Runs daily at midnight UTC
    - cron: '0 0 * * *'
  workflow_dispatch: # Allows manual trigger from GitHub UI

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  run-pipeline:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi

      - name: Step 1 - Extract Raw Data
        env:
          GITHUB_TOKEN: ${{ secrets.TOKEN }}
        run: |
          python src/extract.py

      - name: Step 2 - Transform with dbt
        run: |
          cd transform
          dbt run --profiles-dir ./.dbt
          dbt test --profiles-dir ./.dbt

      - name: Step 3 - Export Marts to Parquet
        run: |
          python src/export.py

      - name: Step 4 - Upload Parquet Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: github-dora-metrics-parquet
          path: data/exports/*.parquet
          retention-days: 14

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Step 5 - Build Evidence Report
        env:
            BASE_PATH: '/${{ github.event.repository.name }}'
        run: |
          cd reports
          npm ci
          npm run sources
          npm run build

      - name: Upload GitHub Pages Artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: 'build/${{ github.event.repository.name }}'

  # deploy:
  #   needs: build
  #   runs-on: ubuntu-latest

  # permissions:
  #   pages: write
  #   id-token: write

  # environment:
  #   name: github-pages
  #   url: ${{ steps.deployment.outputs.page_url }}

  # steps:
  #   - name: Deploy
  #     id: deployment
  #     uses: actions/deploy-pages@v4

  deploy-pages:
    needs: run-pipeline
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4